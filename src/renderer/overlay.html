<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https://cdn.jsdelivr.net data:; style-src 'self' 'unsafe-inline';">
  <title>Argus Overlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<!--
  Eigenes Dokument fuer das Overlay-Fenster (siehe createOverlayWindow in
  main.js). Bewusst nicht index.html mit versteckten Bereichen: das Overlay
  laeuft neben dem Hauptfenster, und ein zweiter Renderer, der das ganze
  Dashboard mit aufbaut, waere waehrend des Spielens verschenkte Arbeit.

  Gezeigt wird nur, was sich in den naechsten Minuten entscheidet.
-->
<body class="overlay-window">

<div id="overlay-view" class="ov">

  <header class="ov-bar" id="ov-bar">
    <span class="ov-logo" data-icon="argus"></span>
    <div class="ov-id">
      <b>Argus</b>
      <span id="ov-mr" class="ov-mr">MR –</span>
    </div>
    <!-- Das echte Spielbild statt eines nachgezeichneten Symbols: die Spuren
         des Nichts sind ein Gegenstand mit eigenem Aussehen, und man sucht sie
         hier an derselben Form wie im Spiel. -->
    <span id="ov-traces" class="ov-traces" title="Void Traces (Spuren des Nichts)">
      <img class="ov-traces-ic" src="assets/icons/currency/traces.png" alt="">
      <b id="ov-traces-val">–</b>
    </span>
    <div class="ov-bar-actions">
      <button id="ov-refresh" class="ov-btn" title="Reload world state"></button>
      <button id="ov-click" class="ov-btn" title="Klicks ans Spiel durchreichen"></button>
      <!-- Der Titel wird in renderHint() aus dem echten Kuerzel gesetzt. -->
      <button id="ov-exit" class="ov-btn" title="Hide the overlay"></button>
    </div>
  </header>

  <div class="ov-body">
    <!-- Steht nur da, wenn die Datenquelle hinterherhinkt. Ohne diesen
         Hinweis sieht eine leere Rissliste wie ein Fehler der App aus. -->
    <div id="ov-stale" class="ov-stale hidden"></div>

    <!-- Relikt-Belohnung. Steht ganz oben und nur, solange der
         Auswahlbildschirm offen ist - danach verschwindet sie wieder. -->
    <section class="ov-relic hidden" id="ov-relic">
      <div class="ov-relic-head">
        <span id="ov-relic-title">Your drop</span>
        <span class="ov-relic-timer" id="ov-relic-timer">–</span>
      </div>
      <div class="ov-relic-body" id="ov-relic-body"></div>
    </section>

    <!-- Empfohlene Relikte aus dem Planer & fuer die Reliktauswahl.
         Zeigt Erwartungswert, Politur und Top-Drop; die sechs Einzelteile
         klappen erst auf Klick auf - im Overlay ist jede Zeile Platz, der
         dem Spiel fehlt. -->
    <section class="ov-sec" id="ov-rec-sec">
      <div class="ov-sec-head">
        <span id="ov-rec-title">Tracked relics</span>
        <span id="ov-rec-note" class="ov-sec-note"></span>
      </div>
      <div class="ov-filter-chips" id="ov-rec-filters">
        <button class="ov-chip active" data-tier="all">All</button>
        <button class="ov-chip" data-tier="Lith">Lith</button>
        <button class="ov-chip" data-tier="Meso">Meso</button>
        <button class="ov-chip" data-tier="Neo">Neo</button>
        <button class="ov-chip" data-tier="Axi">Axi</button>
        <button class="ov-chip" data-tier="tracked">★ Starred</button>
      </div>
      <div id="ov-recommended-list" class="ov-list"></div>
    </section>

    <section class="ov-sec">
      <div class="ov-sec-head"><span>Cycles</span></div>
      <div id="ov-cycles" class="ov-cycles"></div>
    </section>

    <section class="ov-sec">
      <div class="ov-sec-head">
        <span>Void fissures</span>
        <span id="ov-fissure-note" class="ov-sec-note"></span>
      </div>
      <div id="ov-fissures" class="ov-list"></div>
    </section>

    <section class="ov-sec" id="ov-goals-sec">
      <div class="ov-sec-head">
        <span>Open goals</span>
        <span id="ov-goals-note" class="ov-sec-note"></span>
      </div>
      <div id="ov-goals" class="ov-list"></div>
    </section>
  </div>

  <!-- Steht nur da, wenn sie gebraucht wird: bei durchgereichten Klicks ist
       nicht offensichtlich, wie man wieder an die Bedienung kommt. -->
  <div id="ov-hint" class="ov-hint hidden"></div>

  <footer class="ov-foot">
    <label class="ov-opacity" title="Deckkraft des Overlays">
      <span data-icon="sliders"></span>
      <input id="ov-opacity" type="range" min="35" max="100" step="5" value="94">
    </label>
    <span id="ov-age" class="ov-age">—</span>
  </footer>
</div>

<script src="icons.js"></script>
<script src="stock.js"></script>
<script src="fissure-filter.js"></script>
<script src="overlay.js"></script>
</body>
</html>
