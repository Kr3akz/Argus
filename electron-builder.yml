# Verpackung fuer die Auslieferung: NSIS-Installer und portable .exe.
#
# Warum eine eigene Datei und nicht der build-Block in package.json:
# electron-builder prueft seine Konfiguration streng und bricht bei
# unbekannten Feldern ab - Kommentare waeren dort also nicht moeglich. Und
# gerade die Entscheidungen unten sind welche, die man in einem halben Jahr
# nicht mehr herleiten kann.

# Die Kennung behaelt bewusst den alten Namen. Sie ist nirgends sichtbar,
# aber Windows erkennt daran, dass eine neue Fassung dieselbe Anwendung ist -
# mit einer neuen Kennung staende die alte Installation danach daneben statt
# ersetzt zu werden. Muss zu app.setAppUserModelId() in main.js passen.
appId: com.kr3akz.cephalonargus
productName: Argus
copyright: Copyright (c) 2026 Kr3akz

# Die Beschreibung aus package.json wandert als "FileDescription" in die
# .exe - und GENAU die zeigt Windows beim Rechtsklick in der Taskleiste an,
# nicht den Produktnamen. Dort stand deshalb der ganze Satz "Mastery rank
# planner and live companion for Warframe: ...", was aussieht, als hiesse
# das Programm so.
# extraMetadata ersetzt das Feld nur im PAKET; package.json im Repository
# behaelt den ausfuehrlichen Text, den npm und die Startseite brauchen.
extraMetadata:
  description: Argus

directories:
  output: release
  buildResources: build

# POSITIVLISTE - bewusst keine Ausschlussliste.
#
# data/ enthaelt die accountId, das abgerufene Profil und das vollstaendige
# Inventar des Entwicklerrechners. Bei einer Ausschlussliste genuegt ein
# einziger vergessener Eintrag, und diese Dateien liegen in einem
# oeffentlichen Release zum Herunterladen bereit. Was mitkommt, steht deshalb
# einzeln hier - eine neue Datei ist im Zweifel draussen, nicht drin.
#
# node_modules ergaenzt electron-builder von selbst, aber nur die
# Produktiv-Abhaengigkeiten (also koffi, nicht electron-builder).
#
# build-info.json schreibt der Workflow unmittelbar vor dem Paketieren
# (Commit und Bauzeitpunkt, sonst nichts). Sie steht bewusst mit auf der
# Liste - der Abschnitt "About Argus" in den Einstellungen liest sie, und
# ohne sie meldet ein Release denselben Stand wie ein Lauf aus dem
# Quellordner. Fehlt sie, faellt die Anzeige auf "development build" zurueck;
# ein lokales `npm run dist` braucht sie also nicht.
#
# LICENSE MUSS mit. Die GPL verlangt ausdruecklich, dass jeder Empfaenger
# eine Kopie der Lizenz bekommt - und da asar aus ist, liegt der Quelltext
# ohnehin im Installationsordner. Eine Fassung des Quelltexts ohne die
# zugehoerige Lizenz daneben waere genau der Fall, den die GPL ausschliesst.
files:
  - package.json
  - build-info.json
  - LICENSE
  - src/main/**/*
  - src/core/**/*
  - src/renderer/**/*
  - '!**/*.md'

# asar ist bewusst AUS.
#
# Drei Stellen dieser App vertragen sich schlecht mit einem Archiv:
#   - koffi laedt eine .node-Datei; aus einem asar heraus geht das nicht
#   - gamecreds.js startet scan-worker.js als Worker-Thread
#   - fissure-filter.js liest zur Laufzeit eine Datei aus src/renderer/
# Jedes davon liesse sich einzeln per asarUnpack herausloesen. Zusammen ist
# der ausgepackte Ordner der ehrlichere Weg: er kostet etwas Startzeit, macht
# dafuer aber jeden Fehlerbericht nachvollziehbar ("oeffne den Ordner, schau
# in diese Datei"). Zu verbergen gibt es bei quelloffener Software nichts.
asar: false

# tools/ landet NEBEN der App unter resources/, nicht darin - core/paths.js
# sucht die Skripte ueber process.resourcesPath.
# Nur die OCR-Skripte: memscan.ps1 und make-icon.mjs sind Entwicklerwerkzeuge.
# ocr-host.ps1 ist der Dauerlaeufer, den die App im Betrieb benutzt;
# ocr-capture.ps1 bleibt als Einzelaufnahme fuer die CLI-Werkzeuge dabei.
extraResources:
  - from: tools
    to: tools
    filter:
      - ocr-host.ps1
      - ocr-capture.ps1

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  # Kein Ein-Klick-Installer: wer ein Programm installiert, das den Speicher
  # des Spielprozesses liest, soll vorher sehen, wohin es installiert wird.
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Ohne Administratorrechte - die App braucht keine.
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Argus
  artifactName: ${productName}-${version}-Setup.${ext}
  # Ziele, Builds und Notizen liegen in %APPDATA% und sollen eine
  # Deinstallation ueberleben - wer neu installiert, findet seinen Stand wieder.
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName}-${version}-portable.${ext}
